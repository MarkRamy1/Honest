services:
  db:
    image: postgres:16-alpine
    container_name: honest_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-honest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-honest_secret}
      POSTGRES_DB: ${POSTGRES_DB:-honest_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-honest} -d ${POSTGRES_DB:-honest_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: honest_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-honest}:${POSTGRES_PASSWORD:-honest_secret}@db:5432/${POSTGRES_DB:-honest_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:-default_insecure_key_change_in_production}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
